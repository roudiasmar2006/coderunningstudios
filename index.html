<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Running Studios — 15% off your first order</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="description" content="Join the list and get 15% off your first order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // 1) Paste your Brevo form URL here (Brevo → Contacts → Forms → your form → Share → "HTML code" → the form's action="..." URL)
  //    Leave empty to test the page: it will just show the success message.
  const BREVO_FORM_URL = "https://a9319ac0.sibforms.com/serve/MUIFAG2bFUkBEN8fwZSVZsdxAjv_KoSxBYDah6r2PE3oiBxCBBwk1iSScKGSS3d8-TE2hVZnPM8TYS4Jd1zKPHRKh7m3de_i9bjHMs8IasK6XwzhRechxldr33OnohHGk4E7Ar2ZepaV47Bm3eieSAtSsJByZNuc7qOzcI7tkK-sxyF_ubHwphe6gz6f0uBS7TtdAdaIVMtaGrOMog==";
</script>

<style>
  :root {
    --ink: #f4f1ec;
    --ink-soft: rgba(244,241,236,.72);
    --ink-faint: rgba(244,241,236,.38);
    --line: rgba(244,241,236,.32);
    --bg: #0d0d0d;
    --error: #ffb4a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  
  .bg { position: fixed; inset: 0; z-index: 0; }
  .bg video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Vertical video: sharp in the middle, soft blurred copy fills the sides */
  /* Computer: video zoomed in to fill the whole screen. Phone: shown normally. */
  .bg .v-fill { display: none; }
  .bg .v-main { object-fit: cover; object-position: center 52%; }
  @media (max-aspect-ratio: 4/5) {
    .bg .v-main { object-position: center 40%; }
  }
  .bg::after {
    content: ""; position: absolute; inset: 0; opacity: var(--shade, 0); transition: opacity .2s linear;
    background:
      rgba(28,24,22,.78);
  }

  
  .page {
    position: relative; z-index: 1;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 4vw, 48px);
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  .brand {
    font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; font-weight: 500;
    font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--ink); text-decoration: none;
  }
  .tag { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-faint); }

  main { display: flex; align-items: center; justify-content: center; }
  .hero { position: relative; z-index: 1; height: 100svh; display: flex; align-items: center; justify-content: center; }
  .hero-art { position: relative; width: min(84vw, 1240px); container-type: inline-size; }
  .hero img { width: 100%; height: auto; display: block; }
  /* "EARLY ACCESS" link at the bottom of the first screen: same style as the label in the sign-up section */
  /* Bottom-left of the first screen, lined up with the left edge of the logo text */
  .scroll { position: absolute; left: calc((100% - min(84vw, 1240px)) / 2 + min(84vw, 1240px) * 0.041); bottom: 32px; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; line-height: 1; letter-spacing: -0.03em; text-transform: uppercase; white-space: nowrap; padding: 10px 0; margin-bottom: -10px; transition: opacity .4s; }
  .scroll:hover { opacity: .7; }
  .scroll.is-gone { opacity: 0; pointer-events: none; }
  html { scroll-behavior: smooth; }

  /* ---- Early access section (matches the design) ---- */
  /* Same left/right edges as the logo text (new logo: starts 4.1% in, ends at 92.7% of the logo box),
     so "EARLY ACCESS" here lines up with the "EARLY ACCESS" link on the first screen. */
  .panel { position: relative; width: calc(min(84vw, 1240px) * 0.886); left: calc(min(84vw, 1240px) * -0.016); padding: 40px 0; color: #fff; }
  .ea-row { display: grid; grid-template-columns: 1fr 33%; gap: 40px; align-items: center; }
  .label {
    font-weight: 600; font-size: 15px; line-height: 1; letter-spacing: -0.03em;
    text-transform: uppercase; color: #fff;
  }
  .ea-text .lead {
    margin-top: 40px; font-weight: 400; font-size: clamp(18px, 1.75vw, 22px);
    line-height: 1.2; letter-spacing: -0.02em; color: #fff;
  }
  .signup-btn {
    width: 100%; height: clamp(72px, 7.3vw, 92px); border: 0; border-radius: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.24); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; text-transform: uppercase;
    font: 600 clamp(20px, 2vw, 26px)/1 "Inter Tight", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.03em;
    transition: background .25s, color .25s;
  }
  .signup-btn:hover, .signup-btn:focus-visible { background: #fff; color: #0d0d0d; outline: none; }
  .signup-btn:disabled { opacity: .6; cursor: wait; }

  /* Email step: hidden until SIGN UP is pressed */
  .ea-extra { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.2,.7,.2,1); }
  .ea-extra > div { overflow: hidden; }
  .panel.is-open .ea-extra { grid-template-rows: 1fr; }
  .ea-fields { display: grid; gap: 18px; padding-top: 36px; max-width: calc(67% - 40px); }
  .field { border-bottom: 1px solid rgba(255,255,255,.4); transition: border-color .3s; }
  .field:focus-within { border-color: #fff; }
  .field input {
    width: 100%; background: transparent; border: 0; outline: 0; color: #fff;
    font: 400 clamp(18px, 1.75vw, 22px)/1.2 "Inter Tight", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.02em;
    padding: 12px 0;
  }
  .field input::placeholder { color: rgba(255,255,255,.45); }

  .consent { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; line-height: 1.45; letter-spacing: -0.01em; color: rgba(255,255,255,.75); cursor: pointer; }
  .consent input { appearance: none; flex: none; width: 15px; height: 15px; margin-top: 2px; border: 1px solid var(--ink-soft); border-radius: 0; cursor: pointer; display: grid; place-items: center; }
  .consent input:checked { background: var(--ink); border-color: var(--ink); }
  .consent input:checked::after { content: ""; width: 7px; height: 4px; border: solid var(--bg); border-width: 0 0 1.5px 1.5px; transform: rotate(-45deg) translate(1px,-1px); }
  .consent input:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .consent a, footer a { color: var(--ink); text-underline-offset: 3px; }

  .msg { font-size: 13px; min-height: 1em; color: var(--error); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  
  .done { display: none; }
  .panel.is-done #signup { display: none; }
  .panel.is-done .done { display: block; animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .done .big { margin-top: 44px; font-weight: 400; font-size: clamp(28px, 3.4vw, 46px); line-height: 1.1; letter-spacing: -0.03em; }
  .done .small { margin-top: 44px; font-weight: 400; font-size: clamp(16px, 1.6vw, 20px); line-height: 1.3; letter-spacing: -0.02em; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  
  .panel > * { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .panel > *:nth-child(2) { animation-delay: .12s; }
  .panel > *:nth-child(3) { animation-delay: .24s; }
  .panel > *:nth-child(4) { animation-delay: .36s; }
  
  footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 11px; letter-spacing: .08em; color: var(--ink-faint); }
  footer nav { display: flex; gap: 20px; }
  footer a { color: var(--ink-faint); text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 720px) {
    .scroll { left: 20px; bottom: 28px; font-size: 13px; }
    .panel { width: auto; left: 0; padding: 32px 0 40px; }
    .ea-row { grid-template-columns: 1fr; gap: 32px; }
    .ea-text .lead { margin-top: 22px; }
    .ea-fields { max-width: none; }
    .bg::after { background: rgba(28,24,22,.78); }
    .hero { justify-content: flex-start; overflow: hidden; }
    .hero { flex-direction: column; justify-content: center; align-items: stretch; }
    /* Phones: size the logo so its text runs exactly from 20px to 20px from the screen edges */
    .hero-art { width: calc((100vw - 40px) / 0.886); max-width: none; flex: none; margin-left: calc(20px - (100vw - 40px) * 0.0463); }
    .panel { padding: 32px 0 40px; }
    .tag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg video { display: none; }
    .panel > *, .panel.is-done .done { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video class="v-main" autoplay muted loop playsinline preload="auto" poster="hero-poster.jpg">
      <source src="hero-540.mp4" type="video/mp4" media="(max-width: 720px)">
      <source src="hero-1080.mp4" type="video/mp4">
    </video>
  </div>

  <section class="hero">
    <div class="hero-art">
      <img src="logo.png?v=3" alt="Code Running Studios — A new era of movement. Coming soon.">
    </div>
    <a class="scroll" id="ea-link" href="#panel">Early access</a>
  </section>

  <div class="page">
    <header></header>

    <main>
      <section class="panel" id="panel">
        <form id="signup" method="POST" target="brevo-frame" novalidate>
          <div class="ea-row">
            <div class="ea-text">
              <p class="label">Coming Soon</p>
              <p class="lead">Sign up for private pre-access and 15% off your first order</p>
            </div>
            <button type="submit" id="submit" class="signup-btn">Sign up</button>
          </div>

          <div class="ea-extra"><div>
            <div class="ea-fields">
              <div class="field">
                <label for="email" class="hp">Email address</label>
                <input id="email" name="EMAIL" type="email" autocomplete="email" placeholder="Your email address" required>
              </div>
              <label class="consent">
                <input type="checkbox" id="consent" name="OPT_IN" value="1" required>
                <span>I would like to receive emails about new collections and offers. I can unsubscribe at any time</span>
              </label>
              <p class="msg" id="msg" role="alert"></p>
            </div>
          </div></div>

          <!-- Brevo hidden fields -->
          <input class="hp" type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off">
          <input type="hidden" name="locale" value="en">
          <input type="hidden" name="html_type" value="simple">
        </form>

        <div class="done" role="status">
          <p class="label">Almost there</p>
          <p class="big">  Check your inbox and confirm your email</p>
          <p class="small">Once confirmed, you’ll be on the list for pre-access and 15% off your first order</p>
        </div>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> Code Running Studios</span>
    </footer>
  </div>

  <iframe name="brevo-frame" title="" style="display:none"></iframe>

<script>
  // Video stays untouched behind the image; it darkens gently as you scroll to the sign-up.
  const shade = () => document.documentElement.style.setProperty("--shade", Math.min(1, scrollY / innerHeight).toFixed(3));
  addEventListener("scroll", shade, { passive: true }); shade();

  document.getElementById("year").textContent = new Date().getFullYear();

  const form = document.getElementById("signup");
  const email = document.getElementById("email");
  const consent = document.getElementById("consent");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit");
  const panel = document.getElementById("panel");

  if (BREVO_FORM_URL) form.action = BREVO_FORM_URL;

  form.addEventListener("submit", (e) => {
    msg.textContent = "";
    if (!panel.classList.contains("is-open")) {
      e.preventDefault(); panel.classList.add("is-open"); setTimeout(() => email.focus(), 300); return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim())) {
      e.preventDefault(); msg.textContent = "Please enter a valid email address."; email.focus(); return;
    }
    if (!consent.checked) {
      e.preventDefault(); msg.textContent = "Please tick the box to join the list."; return;
    }
    btn.disabled = true;
    if (!BREVO_FORM_URL) { e.preventDefault(); setTimeout(() => { panel.classList.add("is-done"); document.getElementById("ea-link").classList.add("is-gone"); }, 500); return; }
    // Real submit goes to Brevo in the hidden frame; show success once it has been sent.
    setTimeout(() => { panel.classList.add("is-done"); document.getElementById("ea-link").classList.add("is-gone"); }, 1200);
  });
</script>
</body>
</html>
